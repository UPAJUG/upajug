<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>উপযোগ - অ্যাডমিন কন্ট্রোল প্যানেল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b1325 0%, #111a2e 50%, #080d19 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-orange: #ff6b00;
      --accent-gold: #ffb703;
      --gradient-orange: linear-gradient(135deg, #ff8c00, #ff4500);
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Serif Bengali', serif; }
    body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

    header {
      background: rgba(13, 22, 41, 0.75); backdrop-filter: blur(16px);
      padding: 0.8rem 1rem; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255, 107, 0, 0.25); text-align: center;
    }
    .brand-title { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #ffffff, var(--accent-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 2rem; }

    .admin-card {
      background: rgba(19, 31, 56, 0.65); backdrop-filter: blur(16px);
      border-radius: 20px; padding: 1.8rem; border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .card-title { font-size: 1.25rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed rgba(255, 107, 0, 0.3); padding-bottom: 10px; }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .form-control { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); background: #080d19; color: #fff; outline: none; font-size: 0.95rem; }
    .form-control:focus { border-color: var(--accent-orange); }

    .btn-submit { width: 100%; padding: 0.85rem; border-radius: 12px; border: none; background: var(--gradient-orange); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 1rem; }
    
    .list-item { background: rgba(8, 13, 25, 0.6); padding: 1rem; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px; }
    .order-body p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 3px; }
    .order-items { background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 8px; margin: 6px 0; font-size: 0.82rem; color: #fff; }

    .btn-action { padding: 5px 10px; border-radius: 6px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-edit { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .btn-del { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .status-pending { background: rgba(255, 183, 3, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
    .status-completed { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .lock-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 37, 0.95); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
    .lock-box { background: #111a2e; padding: 2rem; border-radius: 20px; border: 1px solid rgba(255, 107, 0, 0.3); text-align: center; max-width: 380px; width: 100%; }
    .status-msg { padding: 0.8rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.88rem; display: none; }
    .status-msg.success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
  </style>
</head>
<body>

  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-box">
      <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: var(--accent-gold); margin-bottom: 1rem;"></i>
      <h3 style="margin-bottom: 0.5rem; color: #fff;">অ্যাডমিন অ্যাক্সেস</h3>
      <input type="password" id="adminPin" class="form-control" placeholder="PIN লিখুন" style="text-align: center; font-size: 1.2rem; margin-bottom: 1rem;">
      <button class="btn-submit" onclick="verifyPin()"><i class="fa-solid fa-key"></i> প্রবেশ করুন</button>
      <p id="pinError" style="color: var(--accent-red); font-size: 0.8rem; margin-top: 8px; display: none;">ভুল পিন!</p>
    </div>
  </div>

  <header><div class="brand-title">উপযোগ - অ্যাডমিন প্যানেল</div></header>

  <div class="container">
    
    <!-- ১. কাস্টমার অর্ডার ম্যানেজমেন্ট সেকশন -->
    <div class="admin-card">
      <div class="card-title"><i class="fa-solid fa-clipboard-list"></i> কাস্টমার অর্ডার লিস্ট (Order Tracking)</div>
      <div id="adminOrderList">
        <p style="font-size: 0.88rem; color: var(--text-muted);">অর্ডার লোড হচ্ছে...</p>
      </div>
    </div>

    <!-- ২. প্রডাক্ট এন্ট্রি/এডিট -->
    <div class="admin-card">
      <div class="card-title" id="formTitleText"><i class="fa-solid fa-plus-circle"></i> নতুন প্রোডাক্ট যুক্ত করুন</div>
      <div id="statusMsg" class="status-msg"></div>
      <form id="productForm">
        <input type="hidden" id="editProductId">
        <div class="form-group">
          <label>প্রোডাক্টের নাম *</label>
          <input type="text" id="prodTitle" class="form-control" placeholder="যেমন: Aesthetic Study Kit" required>
        </div>
        <div class="form-group">
          <label>মূল্য (টাকা) *</label>
          <input type="number" id="prodPrice" class="form-control" placeholder="যেমন: 850" required>
        </div>
        <div class="form-group">
          <label>ক্যাটাগরি *</label>
          <select id="prodCategory" class="form-control" required>
            <option value="study">স্টাডি কিট (study)</option>
            <option value="tech">টেক ও গ্যাজেট (tech)</option>
            <option value="gift">গিফট প্যাক (gift)</option>
          </select>
        </div>
        <div class="form-group">
          <label>বিবরণ *</label>
          <textarea id="prodDesc" class="form-control" placeholder="বিবরণ লিখুন..." required></textarea>
        </div>
        <div class="form-group">
          <label>ছবির লিংক (Google Drive বা Direct Image URL) *</label>
          <input type="url" id="prodImage" class="form-control" placeholder="Image URL..." required>
        </div>
        <div class="form-group">
          <label>ট্যাগ/ব্যাজ</label>
          <input type="text" id="prodBadge" class="form-control" placeholder="যেমন: Best Seller / New">
        </div>
        <div class="form-group">
          <label>কালার থিম</label>
          <select id="prodTheme" class="form-control">
            <option value="theme-purple">Purple</option>
            <option value="theme-red">Red</option>
            <option value="theme-blue">Blue</option>
            <option value="theme-yellow">Yellow</option>
          </select>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> সেভ করুন</button>
        <button type="button" id="cancelBtn" class="btn-submit" style="background:rgba(255,255,255,0.1); display:none;" onclick="resetForm()">বাতিল করুন</button>
      </form>
    </div>

    <!-- ৩. কুপন কোড সেটআপ -->
    <div class="admin-card">
      <div class="card-title"><i class="fa-solid fa-ticket"></i> ডিসকাউন্ট কুপন ম্যানেজমেন্ট</div>
      <form id="couponForm">
        <div class="form-group">
          <label>কুপন কোড *</label>
          <input type="text" id="cpCode" class="form-control" placeholder="যেমন: EID20" style="text-transform: uppercase;" required>
        </div>
        <div class="form-group">
          <label>ডিসকাউন্ট পার্সেন্ট (%) *</label>
          <input type="number" id="cpPercent" class="form-control" placeholder="যেমন: 20" required>
        </div>
        <div class="form-group">
          <label>প্রযোজ্য প্রডাক্ট</label>
          <select id="cpProductId" class="form-control">
            <option value="ALL">সকল প্রডাক্টের জন্য প্রযোজ্য</option>
          </select>
        </div>
        <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #10b981, #059669);">
          <i class="fa-solid fa-plus"></i> কুপন যুক্ত করুন
        </button>
      </form>
      <h4 style="margin-top: 1.5rem; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--accent-gold);">বিদ্যমান কুপনসমূহ:</h4>
      <div id="couponListContainer"><p style="font-size:0.85rem; color:var(--text-muted);">কুপন লোড হচ্ছে...</p></div>
    </div>

    <!-- ৪. বিদ্যমান প্রডাক্ট ম্যানেজমেন্ট -->
    <div class="admin-card">
      <div class="card-title"><i class="fa-solid fa-boxes-stacked"></i> সমস্ত প্রোডাক্ট লিস্ট</div>
      <div id="adminProductList"><p style="font-size: 0.88rem; color: var(--text-muted);">লোড হচ্ছে...</p></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIWTUniMXQ1APED_oaPHAPeHklr0NsJqA",
      authDomain: "upojog-shop.firebaseapp.com",
      projectId: "upojog-shop",
      storageBucket: "upojog-shop.firebasestorage.app",
      messagingSenderId: "614249564429",
      appId: "1:614249564429:web:55aa28e3a1a948ce254844"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.verifyPin = function() {
      if(document.getElementById('adminPin').value === "1234") {
        document.getElementById('lockOverlay').style.display = 'none';
        loadAdminProducts();
        loadAdminCoupons();
        loadAdminOrders();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    };

    let allProducts = [];

    // ড্রাইভ লিংক কনভার্টার ফাংশন
    function formatImageUrl(url) {
      if (!url) return '';
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    }

    // অর্ডার লিস্ট লোড করার ফাংশন
    async function loadAdminOrders() {
      const container = document.getElementById('adminOrderList');
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        if(querySnapshot.empty) {
          container.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted);">এই মুহূর্তে কোনো নতুন অর্ডার নেই।</p>`;
          return;
        }

        let html = '';
        querySnapshot.forEach((docSnap) => {
          const o = docSnap.data();
          const orderId = docSnap.id;
          const statusClass = o.status === 'Completed' ? 'status-completed' : 'status-pending';
          const statusText = o.status === 'Completed' ? 'Completed (সম্পন্ন)' : 'Pending (পেন্ডিং)';

          let itemsHtml = '';
          if(o.items && Array.isArray(o.items)) {
            o.items.forEach(item => {
              itemsHtml += `• ${item.title} (${item.qty} pcs) - ৳${item.price * item.qty}<br>`;
            });
          }

          html += `
            <div class="list-item">
              <div class="order-header">
                <strong style="color:var(--accent-gold); font-size:0.95rem;">👤 ${o.customerName}</strong>
                <span class="status-badge ${statusClass}" onclick="toggleOrderStatus('${orderId}', '${o.status || 'Pending'}')" style="cursor:pointer;" title="স্ট্যাটাস বদলাতে ক্লিক করুন">${statusText}</span>
              </div>
              <div class="order-body">
                <p><strong>📞 ফোন:</strong> ${o.customerPhone}</p>
                <p><strong>📍 ঠিকানা:</strong> ${o.customerAddress}</p>
                <div class="order-items"><strong>📦 প্রডাক্টসমূহ:</strong><br>${itemsHtml}</div>
                <p><strong>💰 মোট মূল্য:</strong> ৳${o.totalAmount} | <strong>অগ্রিম (${o.paymentMethod}):</strong> ৳${o.advancePaid}</p>
                <p><strong>💳 পেমেন্ট সেন্ডার:</strong> ${o.paymentSender} (TrxID: ${o.transactionId})</p>
                <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">🕒 সময়: ${new Date(o.orderDate).toLocaleString('bn-BD')}</p>
              </div>
              <div style="margin-top: 8px; text-align: right;">
                <button class="btn-action btn-del" onclick="deleteOrder('${orderId}')"><i class="fa-solid fa-trash"></i> অর্ডার মুছুন</button>
              </div>
            </div>`;
        });
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p style="color:var(--accent-red); font-size:0.85rem;">অর্ডার লোড করতে সমস্যা হয়েছে।</p>`;
      }
    }

    window.toggleOrderStatus = async function(orderId, currentStatus) {
      const newStatus = currentStatus === 'Pending' ? 'Completed' : 'Pending';
      try {
        await updateDoc(doc(db, "orders", orderId), { status: newStatus });
        loadAdminOrders();
      } catch (e) {
        alert("স্ট্যাটাস আপডেট করা যায়নি!");
      }
    };

    window.deleteOrder = async function(orderId) {
      if(confirm("আপনি কি নিশ্চিতভাবে এই অর্ডারটি ডিলিট করতে চান?")) {
        try {
          await deleteDoc(doc(db, "orders", orderId));
          loadAdminOrders();
        } catch (e) {
          alert("অর্ডার ডিলিট করা যায়নি!");
        }
      }
    };

    async function loadAdminProducts() {
      const listContainer = document.getElementById('adminProductList');
      const cpSelect = document.getElementById('cpProductId');
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        let selectHtml = `<option value="ALL">সকল প্রডাক্টের জন্য প্রযোজ্য</option>`;

        querySnapshot.forEach((docSnap) => {
          const p = { id: docSnap.id, ...docSnap.data() };
          allProducts.push(p);
          selectHtml += `<option value="${p.id}">${p.title}</option>`;
        });

        cpSelect.innerHTML = selectHtml;

        if(allProducts.length === 0) {
          listContainer.innerHTML = `<p style="color: var(--text-muted); font-size: 0.88rem;">কোনো প্রোডাক্ট নেই।</p>`;
          return;
        }

        let html = '';
        allProducts.forEach(p => {
          html += `
            <div class="list-item" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <h4 style="color:#fff;">${p.title}</h4>
                <p style="font-size:0.8rem; color:var(--accent-gold);">৳${p.price} (${p.category})</p>
              </div>
              <div>
                <button class="btn-action btn-edit" onclick="prepareEdit('${p.id}')">এডিট</button>
                <button class="btn-action btn-del" onclick="deleteProduct('${p.id}')">ডিলিট</button>
              </div>
            </div>`;
        });
        listContainer.innerHTML = html;
      } catch (e) {
        console.error(e);
      }
    }

    async function loadAdminCoupons() {
      const container = document.getElementById('couponListContainer');
      try {
        const querySnapshot = await getDocs(collection(db, "coupons"));
        if(querySnapshot.empty) {
          container.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted);">কোনো কুপন নেই।</p>`;
          return;
        }
        let html = '';
        querySnapshot.forEach((docSnap) => {
          const c = docSnap.data();
          html += `
            <div class="list-item" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong style="color:var(--accent-gold);">${c.code}</strong> (${c.percent}% ছাড়)
              </div>
              <button class="btn-action btn-del" onclick="deleteCoupon('${docSnap.id}')">মুছুন</button>
            </div>`;
        });
        container.innerHTML = html;
      } catch (e) {}
    }

    document.getElementById('couponForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('cpCode').value.trim().toUpperCase();
      const percent = Number(document.getElementById('cpPercent').value);
      const productId = document.getElementById('cpProductId').value;
      try {
        await addDoc(collection(db, "coupons"), { code, percent, productId });
        alert("🎉 কুপন যুক্ত হয়েছে!");
        document.getElementById('couponForm').reset();
        loadAdminCoupons();
      } catch (err) {}
    });

    window.deleteCoupon = async function(id) {
      if(confirm("কুপন মুছবেন?")) {
        await deleteDoc(doc(db, "coupons", id));
        loadAdminCoupons();
      }
    };

    window.prepareEdit = function(id) {
      const p = allProducts.find(x => x.id === id);
      if(!p) return;
      document.getElementById('editProductId').value = p.id;
      document.getElementById('prodTitle').value = p.title;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodDesc').value = p.desc;
      document.getElementById('prodImage').value = p.image;
      document.getElementById('prodBadge').value = p.badge || '';
      document.getElementById('prodTheme').value = p.theme || 'theme-purple';
      document.getElementById('formTitleText').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> প্রোডাক্ট এডিট করুন`;
      document.getElementById('cancelBtn').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = function() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('formTitleText').innerHTML = `<i class="fa-solid fa-plus-circle"></i> নতুন প্রোডাক্ট যুক্ত করুন`;
      document.getElementById('cancelBtn').style.display = 'none';
    };

    window.deleteProduct = async function(id) {
      if(confirm("প্রোডাক্ট ডিলিট করবেন?")) {
        await deleteDoc(doc(db, "products", id));
        loadAdminProducts();
      }
    };

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const rawImage = document.getElementById('prodImage').value.trim();
      
      const productData = {
        title: document.getElementById('prodTitle').value.trim(),
        price: Number(document.getElementById('prodPrice').value),
        category: document.getElementById('prodCategory').value,
        desc: document.getElementById('prodDesc').value.trim(),
        image: formatImageUrl(rawImage),
        badge: document.getElementById('prodBadge').value.trim() || 'New',
        theme: document.getElementById('prodTheme').value
      };

      try {
        if(editId) {
          await updateDoc(doc(db, "products", editId), productData);
          alert("✅ প্রোডাক্ট সফলভাবে আপডেট করা হয়েছে!");
          resetForm();
        } else {
          await addDoc(collection(db, "products"), productData);
          alert("🎉 নতুন প্রোডাক্ট সফলভাবে যুক্ত হয়েছে!");
          document.getElementById('productForm').reset();
        }
        loadAdminProducts();
      } catch (err) {
        console.error(err);
        alert("প্রোডাক্ট সংরক্ষণ করতে সমস্যা হয়েছে!");
      }
    });
  </script>
</body>
